  backend:
    build:
      context: .
    container_name: fastapi_wallet_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    command: sh -c "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload" #alembic upgrade head &&
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - wallet_network

volumes:
  postgres_data:

networks:
  wallet_network:
    driver: bridge