services:
  db:
    image: postgres:15
    container_name: postgres_wallet
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wallet_network

  test_db:
    image: postgres:15-alpine
    container_name: test_postgres_wallet
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wallet_network

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file:
      - .env
    container_name: tests_wallet
    depends_on:
      test_db:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - wallet_network

  backend:
    build:
      context: .
    container_name: fastapi_wallet_app
    depends_on:
      db:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - wallet_network

volumes:
  postgres_data:

networks:
  wallet_network:
    driver: bridge